name: Continuous Deployment (GitOps)

on:
  push:
    branches:
      - main
    paths:
      - 'k8s/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy-helm:
    name: Deploy Helm Chart to K3s
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to K3s Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "===> Pulling latest code from Git..."
            cd ~/iac-lab
            git pull origin main

            echo "===> Deploying Helm Chart..."
            helm upgrade --install my-demo ./k8s/demo-app-chart \
              --namespace demo-app \
              --create-namespace

            echo "===> Checking deployment status..."
            kubectl rollout status deployment/my-demo-app -n demo-app --timeout=60s
