---
- name: Restore database playbook
  hosts: all
  become: true

  tasks:
    - name: Find latest backup file
      ansible.builtin.shell: set -o pipefail && ls -t /var/backups/*.sql.gz | head -n 1
      args:
        executable: /bin/bash
      register: latest_backup
      changed_when: false

    - name: Fail if no backup found
      ansible.builtin.fail:
        msg: "No backup files found in /var/backups/"
      when: latest_backup.stdout == ""

    - name: Display backup file to restore
      ansible.builtin.debug:
        msg: "Restoring from: {{ latest_backup.stdout }}"

    - name: Restore PostgreSQL database from backup
      ansible.builtin.shell: set -o pipefail && zcat {{ latest_backup.stdout }} | docker exec -i $(docker ps -qf 'name=db') psql -U app_user -d app_db
      args:
        executable: /bin/bash
      changed_when: true
